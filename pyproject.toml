[project]
name = "upstox-trading-bot"
version = "0.1.0"
description = "Autonomous trading bot for Indian markets using Upstox broker"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pyarrow>=15",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring network",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
